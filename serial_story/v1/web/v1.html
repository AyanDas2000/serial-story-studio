<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="studio-token" content="">
<meta name="color-scheme" content="light">
<title>Writing desk</title>
<link rel="icon" href="/v1.css" type="image/x-icon">
<link rel="stylesheet" href="/v1.css">
<script src="/v1.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to writing desk</a>
<div class="banner" id="offline">Loading the desk.</div>
<header class="top">
 <div><div class="brand">Writing desk</div><div class="meta" id="checkpoint">Opening your story</div></div>
 <div class="actions"><span id="storage-label" class="meta">Saved by the desk</span><button type="button" data-action="history">History</button></div>
</header>
<nav class="phone-tools" aria-label="Reading shortcuts"><button type="button" data-action="writing-focus">Back to words</button><button type="button" data-action="talk">Talk it through</button></nav>
<div class="layout">
 <aside class="index" aria-label="Sections"><h2>Sections</h2><nav id="view-nav" aria-label="Authoring views"></nav><h2>Episodes</h2><nav id="episode-nav" class="episode-nav" aria-label="Episodes"></nav><div id="index-basis" class="meta"></div></aside>
 <main id="main" tabindex="-1" aria-busy="true"><p class="empty">Loading your story from the desk.</p></main>
 <aside class="conversation" id="conversation" aria-label="Conversation">
  <div class="talk-head"><h2>Talk it through</h2><p class="meta">Replies come from the practice writer. Chatting never changes your story.</p></div>
  <div>
   <label for="chat-scope">What are you talking about?</label>
   <select id="chat-scope" class="full"><option value="story">Whole story</option><option value="direction">Story direction</option><option value="arc">Episode plan</option><option value="episode">The episode I am reading</option></select>
   <div id="thread" class="thread" aria-label="Conversation so far"></div>
   <p class="meta" id="thread-note"></p>
   <label for="composer">Question, feedback, or a new idea</label>
   <textarea id="composer" placeholder="What if Darin hears the report but refuses its certainty?"></textarea>
   <div class="actions"><button type="button" class="primary" data-action="send">Send</button></div>
  </div>
 </aside>
</div>
<div role="status" aria-live="polite" aria-atomic="true" id="status" class="status"></div>
<dialog id="modal" aria-labelledby="modal-title"><h2 id="modal-title"></h2><div id="modal-body"></div><div class="actions" id="modal-actions"><button type="button" data-action="close-modal">Close</button></div></dialog>
</body>
</html>
